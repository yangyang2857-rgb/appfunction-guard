# Android library build: guard-core + guard-ksp + sample
#
# 说明：不用 android-actions/setup-android@v3。
# 该 action 内部会执行 `sdkmanager tools`，而 `tools` 包在 2024 年后已从 Google 仓库移除，
# 结果是 "Warning: Failed to find package 'tools'" 并 exit code 1。
# GitHub 的 ubuntu-latest runner 本身预装了 Android SDK（/usr/local/lib/android/sdk），
# 所以这里直接用它自带的 sdkmanager 装需要的组件，少一层包装少一个坑。

name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          echo "--- installed before ---"
          "$SDKMGR" --list_installed 2>/dev/null | head -30 || true

          "$SDKMGR" --install "platforms;android-36" "platform-tools" 2>&1 | tail -3 || true

          for BT in 36.0.0 36.0.1 36.1.0 35.0.0; do
            if "$SDKMGR" --install "build-tools;$BT" > /tmp/bt.log 2>&1; then
              echo "build-tools $BT installed"
              break
            fi
          done
          tail -3 /tmp/bt.log || true

          echo "--- installed after ---"
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Diagnose plugin repositories
        run: |
          set -x
          gradle --version || true
          for R in "https://dl.google.com/dl/android/maven2" "https://repo.maven.apache.org/maven2" "https://plugins.gradle.org/m2"; do
            U="$R/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.2.20-2.0.2/com.google.devtools.ksp.gradle.plugin-2.2.20-2.0.2.pom"
            printf "%s -> " "$R"
            curl -s -o /dev/null -w "%{http_code}\n" -L --max-time 30 "$U" || echo "curl-fail"
          done
          echo "--- gradle help ---"
          gradle help --no-daemon --info 2>&1 | grep -iE "ksp|repository|resolv|https?://" | head -40 || true

      - name: Assemble
        run: |
          gradle assembleDebug \
            :guard-audit:assemble \
            :guard-ui:assembleDebug \
            :guard-cli:installDist \
            --stacktrace --no-daemon

      - name: Unit tests
        run: |
          gradle testDebugUnitTest :guard-core:testDebugUnitTest :guard-audit:test :guard-cli:test \
            --stacktrace --no-daemon

      # 把跑了多少条、挂了几条打出来。"测试通过"这四个字得有人数兜底。
      - name: Test counts
        if: always()
        run: |
          python3 -c "
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob('*/build/test-results/**/TEST-*.xml', recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0))
              f += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f'tests={t} failures={f}')
          "

      # 拦截链的行为断言跑在 Robolectric 上，失败时报告比 logcat 好读得多。
      - name: Upload unit test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            guard-core/build/reports/tests/**
            guard-core/build/test-results/**
          retention-days: 7

      # CLI 是"离线分析审计"的最后一环，构建通过不代表能用，所以真跑一遍。
      - name: CLI smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/afg
          printf '%s\n' \
            '{"timestampMillis":1700000000000,"functionId":"listNotes","callerPackage":"com.example.agent","callerUid":10123,"decision":"ALLOWED","durationMillis":3,"argsDigest":"a1b2c3d4e5f60718","piiRedacted":0,"errorCode":null,"degraded":false}' \
            '{"timestampMillis":1700000001000,"functionId":"wipeAllNotes","callerPackage":"com.evil.agent","callerUid":10999,"decision":"DENIED_POLICY","durationMillis":1,"argsDigest":null,"piiRedacted":0,"errorCode":"afg_policy_denied","degraded":false}' \
            > /tmp/afg/audit.jsonl

          BIN=guard-cli/build/install/guard-cli/bin/guard-cli

          echo "--- summary ---"
          "$BIN" summary --in /tmp/afg/audit.jsonl | tee /tmp/afg/summary.txt
          grep -q "记录条数: 2" /tmp/afg/summary.txt
          grep -q "被拦截: 1" /tmp/afg/summary.txt

          echo "--- export csv ---"
          "$BIN" export --in /tmp/afg/audit.jsonl --out /tmp/afg/audit.csv --format csv
          cat /tmp/afg/audit.csv
          grep -q "wipeAllNotes" /tmp/afg/audit.csv

          echo "--- stdin + json round trip ---"
          cat /tmp/afg/audit.jsonl | "$BIN" summary --in - | grep -q "记录条数: 2"
          "$BIN" export --in /tmp/afg/audit.jsonl --out /tmp/afg/round.jsonl --format json
          "$BIN" summary --in /tmp/afg/round.jsonl | grep -q "记录条数: 2"

      - name: CLI usage exit code
        run: |
          set +e
          guard-cli/build/install/guard-cli/bin/guard-cli > /tmp/afg/usage.txt 2>&1
          CODE=$?
          cat /tmp/afg/usage.txt
          test "$CODE" -eq 2

      # 发布链路自查：不碰密钥、不联网校验，只确认 POM / sources / javadoc 三件套齐不齐。
      # 真正上传 Central 需要 Sonatype 凭据与 GPG 密钥，见 docs/PUBLISHING.md。
      - name: Publication metadata
        run: |
          set -euo pipefail
          gradle publishAllToLocal --stacktrace --no-daemon
          V=0.1.0-alpha3
          for M in guard-audit guard-core guard-ksp guard-ui; do
            D="$HOME/.m2/repository/io/github/yangyang2857-rgb/$M/$V"
            echo "--- $M ---"
            ls -1 "$D" || { echo "missing directory: $M"; exit 1; }
            test -f "$D/$M-$V.pom"          || { echo "missing pom: $M"; exit 1; }
            test -f "$D/$M-$V-sources.jar"  || { echo "missing sources: $M"; exit 1; }
            test -f "$D/$M-$V-javadoc.jar"  || { echo "missing javadoc: $M"; exit 1; }
            grep -q "MIT License" "$D/$M-$V.pom" || { echo "pom license missing: $M"; exit 1; }
            grep -q "github.com/yangyang2857-rgb/appfunction-guard" "$D/$M-$V.pom" || { echo "pom scm missing: $M"; exit 1; }
          done
          echo "publication metadata OK"

      - name: Dump generated KSP sources
        if: failure()
        run: |
          echo "--- generated ksp sources ---"
          find . -path "*generated/ksp*" -name "*.kt" -print -exec cat {} \; || true

      - name: Upload sample APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CLI distribution
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: guard-cli
          path: guard-cli/build/install/guard-cli/
          if-no-files-found: warn
          retention-days: 7

  # 发布链路演练：不走 Sonatype 的 Nexus staging（OSSRH 已退役），直接产出 Central Portal
  # 能吃的 zip，并把签名、POM 必填项、sources/javadoc 都验一遍。
  # 用一次性密钥签名，只证明"链路通"，产出的 bundle 不能上架（公钥不在 keyserver 上）。
  central-bundle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "platform-tools" 2>&1 | tail -3 || true
          for BT in 36.0.0 36.0.1 36.1.0 35.0.0; do
            if "$SDKMGR" --install "build-tools;$BT" > /tmp/bt.log 2>&1; then
              echo "build-tools $BT installed"
              break
            fi
          done
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Build and verify Central bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/make-central-bundle.sh --ephemeral-key

      - name: Upload bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: build/distributions/central-bundle.zip
          if-no-files-found: warn
          retention-days: 7
