# GitHub Actions：编译验证
#
# 本文件放在 ci/ 而不是 .github/workflows/，原因见 docs/CI.md：
# 用只有 repo scope 的 token 通过 REST API 写 .github/workflows/*.yml 会返回 404，
# GitHub 要求写 workflow 文件必须额外持有 workflow scope。
#
# 启用方式（任选其一）：
#   1. 网页：仓库首页 → Add file → Create new file → 路径填 .github/workflows/build.yml → 粘贴本文件内容 → Commit
#   2. 本地：mkdir -p .github/workflows && cp ci/build.yml .github/workflows/build.yml && git push
#
# 仓库里没有 gradle wrapper（生成它需要一次本地 Gradle 8.13），
# 所以这里用 setup-gradle 拉发行版直接跑 gradle 命令。

name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Assemble
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Upload sample APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
